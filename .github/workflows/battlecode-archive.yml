name: Test Mini Battlecode database archive
on:
  push:
    paths:
      - 'battlecode_archive/**'
      - 'myblog/settings.py'
      - 'myblog/urls.py'
      - '.github/workflows/battlecode-archive.yml'
  pull_request:
    paths:
      - 'battlecode_archive/**'
      - 'myblog/settings.py'
      - 'myblog/urls.py'
      - '.github/workflows/battlecode-archive.yml'
jobs:
  django:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-test-only-django-secret-key
      DEBUG: 'True'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py test battlecode_archive -v 2
