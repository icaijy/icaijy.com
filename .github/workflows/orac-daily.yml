name: ORAC daily snapshots

on:
  schedule:
    # 12:17 UTC = 22:17 Melbourne (AEST), 23:17 (AEDT).
    - cron: '17 12 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/orac-daily.yml'
      - 'orac_tracker/scraper.py'
      - 'orac_tracker/snapshots.py'

permissions:
  contents: write

concurrency:
  group: orac-daily-snapshots
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scraper dependencies
        run: python -m pip install requests==2.32.3 beautifulsoup4==4.10.0
      - name: Fetch and validate public leaderboards
        run: python -m orac_tracker.snapshots
      - name: Commit daily data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/orac
          if git diff --cached --quiet; then
            echo 'No new daily snapshot.'
            exit 0
          fi
          git commit -m 'data: record daily ORAC leaderboard snapshot'
          # Retain an unrelated site update pushed while the scrape was running.
          git pull --rebase origin main
          git push origin HEAD:main
