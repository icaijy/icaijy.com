name: OI daily solved-count snapshots

on:
  schedule:
    # 12:42 UTC = 22:42 AEST / 23:42 AEDT.
    # After the existing ORAC job at 12:17 UTC.
    - cron: '42 12 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oi-daily.yml'
      - 'oi_daily/**'
  pull_request:
    paths:
      - '.github/workflows/oi-daily.yml'
      - 'oi_daily/**'

permissions:
  contents: write

concurrency:
  group: oi-daily-snapshots
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install requests==2.32.3
      - name: Run collector unit tests (no network)
        run: python -m unittest discover -s oi_daily -p 'test_*.py'

  collect:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install requests==2.32.3
      - name: Read public solved counts and isolate source failures
        run: python -m oi_daily.collector
      - name: Commit snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/oi-daily
          if git diff --cached --quiet; then
            echo 'No changed daily snapshot.'
            exit 0
          fi
          git commit -m 'data: capture daily OI solved counts'
          git pull --rebase origin main
          git push origin HEAD:main
